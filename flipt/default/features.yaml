version: "1.5"
namespace:
    key: default
    name: Default
flags:
    - key: testflag
      name: testflag
      type: BOOLEAN_FLAG_TYPE
      enabled: false
      rollouts:
        - segment:
            keys:
                - internal-users
            operator: OR_SEGMENT_OPERATOR
            value: true
segments:
    - key: internal-users
      name: internal users
      constraints:
        - type: STRING_COMPARISON_TYPE
          property: userId
          operator: isoneof
          value: '["1","45314"]'
      match_type: ALL_MATCH_TYPE
